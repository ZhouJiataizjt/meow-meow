<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>我的猫咪记录</title>
    <link rel="icon" href="../assets/favicon.ico">
  <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/icons.css">
  <style>
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
    th { background-color: #f8f9fa; font-weight: 600; color: #2c3e50; cursor: pointer; user-select: none; }
    th:hover { background-color: #e9ecef; }
    tr:hover { background-color: #f1f1f1; }
    tbody { display: table-row-group; }
    thead { display: table-header-group; }
    
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .search-box { flex: 1; max-width: 300px; margin-right: 20px; margin-bottom: 0; }

    .delBtn {
        background-color: #e74c3c;
        padding: 5px 10px;
        font-size: 12px;
    }
    .delBtn:hover { background-color: #c0392b; }

    .editBtn {
         background-color: #df7d5c;
        padding: 5px 10px;
        font-size: 12px;
    }
    .public-record-details { margin-top: 6px; max-width: 34ch; }
    .public-record-details summary { color: var(--app-primary-dark); cursor: pointer; }
    .public-record-details p { white-space: pre-wrap; overflow-wrap: anywhere; }
    .public-record-details img { display: block; max-width: min(100%, 220px); max-height: 180px; margin-top: 8px; object-fit: contain; }
    #records-more { margin-top: 16px; }
  </style>
    <link rel="stylesheet" href="../css/workspace.css">
    <link rel="stylesheet" href="../css/light.css">
</head>
<body class="records-page">
    <div class="container" style="max-width: 100%;">
        
        <div class="workspace-intro"><h2>相遇手记</h2><p>按时间整理偶遇，留住每只猫咪的日常。</p></div>
        <div class="toolbar">
            <label class="filter-field">搜索范围<select id="search-field" aria-label="搜索字段">
                <option value="all">全部字段</option><option value="time">发现时间</option><option value="location">地点 / 标题</option><option value="species">猫咪 / 品种</option><option value="gender">毛色 / 特征</option><option value="area">校园</option><option value="cat_name">猫咪昵称</option><option value="cat_id">猫咪 ID</option><option value="count">数量</option><option value="desc">观察描述</option><option value="id">记录 ID</option>
            </select></label>
            <label class="filter-field search-entry">关键词<input id="search" class="search-box" type="search" aria-label="搜索观察记录" placeholder="搜索全部字段，空格分隔多个关键词"></label>
            <label class="filter-field">记录来源<select id="record-source" aria-label="记录来源"><option value="all">全部记录</option><option value="record">观察记录</option><option value="map">地图打卡</option></select></label>
            <label class="filter-field">地点状态<select id="location-status"><option value="all">全部</option><option value="missing">缺少具体地点</option></select></label>
            <span class="records-summary" id="records-summary" aria-live="polite"></span>
            <button onclick="add_records()">添加记录</button>
        </div>

        <p id="records-status" role="status" hidden></p>
        <div class="records-table-scroll" role="region" aria-label="观察记录表" tabindex="0">
        <table>
          <thead>
          <tr>
            <th data-field="time">发现时间 ↕</th>
            <th data-field="location">地点 ↕</th>
            <th data-field="count">数量 ↕</th>
            <th data-field="species">猫咪/品种 ↕</th>
            <th data-field="gender">毛色/特征 ↕</th>
            <th>猫咪档案</th>
            <th>操作</th>
          </tr>
          </thead>
          <tbody id="records_body"></tbody>
        </table>
        </div>
        <p id="records-empty" role="status" hidden>还没有符合条件的记录。试试其他关键词，或添加一条观察记录。</p>
        <button id="records-more" type="button" hidden>加载更多观察</button>
    </div>

<script>
  const { ipcRenderer } = require('electron')
  if (window.parent !== window) document.body.classList.add('embedded-page')
  const { combineObservations, filterObservations } = require('../../backend/observation_search')
  const { escapeHtml } = require('../../backend/utils')
  const { loadAreasData, campusOptions } = require('../../backend/areas')
  const areasData = loadAreasData()
  const publicScope = new URLSearchParams(location.search).get('scope') === 'public'
  const more = document.getElementById('records-more')
  let nextOffset = 0
  const publicItems = new Map()
  if (publicScope) {
    document.title = '公开观察'
    document.querySelector('.workspace-intro h2').textContent = '猫友的观察记录'
    document.querySelector('.workspace-intro p').textContent = '按地点、猫咪或时间搜索已加载的观察。'
    more.addEventListener('click', () => loadRecords(true))
  }
  let records = []
  let cats = []

  let loadingRecords = false
  async function loadRecords(append = false) {
    if (loadingRecords) return
    loadingRecords = true
    const message = document.getElementById('records-status')
    try {
      if (publicScope) {
        more.disabled = true
        const page = await ipcRenderer.invoke('get_public_observations', append ? nextOffset : 0)
        if (!append) publicItems.clear()
        for (const item of page.items) publicItems.set(JSON.stringify([item.kind, item.user_id, item.id]), item)
        records = Array.from(publicItems.values()).flatMap(item => item.kind === 'map_records'
          ? combineObservations([], [item], []) : combineObservations([item], [], []))
        nextOffset = page.nextOffset
        more.hidden = nextOffset === null
      } else {
        const [ordinary, mapped, allCats] = await Promise.all([
          ipcRenderer.invoke('get_records'), ipcRenderer.invoke('get_own_map_records'), ipcRenderer.invoke('get_cats')
        ])
        cats = allCats || []
        records = combineObservations(ordinary || [], mapped || [], cats)
      }
      message.hidden = true
      applyFilters()
    } catch (error) {
      message.textContent = '记录读取失败。' + error.message
      message.hidden = false
      document.getElementById('records-empty').hidden = true
    } finally {
      loadingRecords = false
      more.disabled = false
    }
  }

  function catNameOf(record) {
    if (publicScope) return record.cat_name || ''
    if (record.cat_id === undefined || record.cat_id === null || record.cat_id === '') return ''
    const cat = cats.find(c => String(c.id) === String(record.cat_id))
    return cat ? `${cat.name} · ID: ${cat.id}` : (record.cat_name || '')
  }

  function displayRecords(data) {
    document.getElementById('records-summary').textContent = `${publicScope ? '已加载' : '共'} ${records.length} 条 · 当前 ${data.length} 条`
    const tbody = document.getElementById('records_body')
    tbody.innerHTML = ''
    document.getElementById('records-empty').hidden = data.length > 0
    data.forEach(r => {
      // data-index 必须是记录在完整 records 数组中的下标：
      // 搜索/排序后显示的是子集，用子集下标会编辑/删除到错误的记录
      const originalIndex = records.indexOf(r)
      const catName = catNameOf(r)
      const tr = document.createElement('tr')
      const idAttr = r.id ? `data-id="${escapeHtml(r.id)}"` : '';
      tr.innerHTML = `
            <td>${escapeHtml(String(r.time || '').replace('T', ' ').slice(0, 16))}${r.area ? `<div style="font-size:11px;color:var(--muted-color);margin-top:2px;"><img class="ui-icon" src="../assets/学校-L.svg" alt="" aria-hidden="true"> ${escapeHtml(r.area)}</div>` : ''}</td>
            <td>${escapeHtml(r.location)}${hasSpecificLocation(r) ? '' : '<small class="record-source-label">缺少具体地点</small>'}<small class="record-source-label">${escapeHtml(r.source_label)}${publicScope && r.profiles?.username ? ' · ' + escapeHtml(r.profiles.username) : ''}</small></td>
            <td>${escapeHtml(r.count ?? "—")}</td>
            <td>${escapeHtml(r.species)}</td>
            <td>${escapeHtml(r.gender)}</td>
            <td>${catName ? `<img class="ui-icon " src="../assets/猫咪.svg" alt="" aria-hidden="true"> ${escapeHtml(catName)}` : '<span style="color:#bbb;">未关联</span>'}</td>
            <td>
                ${r._source === 'map' && Number.isFinite(r.lat) && Number.isFinite(r.lng) ? `<button class="locateBtn" data-row="${originalIndex}">定位到地图</button>` : '<span class="no-location">无坐标</span>'}
                ${publicScope ? '' : `<button class="editBtn" data-index="${originalIndex}" ${idAttr}>编辑</button>
                <button class="delBtn" data-index="${originalIndex}" ${idAttr}>删除</button>`}
            </td>
        `
      tbody.appendChild(tr)
      if (publicScope && (r.desc || r.notes || r.photoUrls?.length)) {
        const details = document.createElement('details')
        details.className = 'public-record-details'
        const summary = document.createElement('summary')
        summary.textContent = '查看观察详情'
        details.append(summary)
        for (const content of [r.desc, r.notes].filter(Boolean)) {
          const note = document.createElement('p')
          note.textContent = content
          details.append(note)
        }
        for (const url of r.photoUrls || []) {
          const image = document.createElement('img')
          image.src = url
          image.alt = '猫咪观察照片'
          image.loading = 'lazy'
          details.append(image)
        }
        tr.cells[1].append(details)
      }
    })

    document.querySelectorAll('.locateBtn').forEach(button => button.onclick = () => {
      const record = records[Number(button.dataset.row)]
      if (window.parent !== window) window.parent.postMessage({ type: 'locate-record', record: { id: record.id, lat: record.lat, lng: record.lng } }, '*')
      else ipcRenderer.invoke('open_map_window', { id: record.id, lat: record.lat, lng: record.lng })
    })

    // 给删除按钮绑定事件
    document.querySelectorAll('.delBtn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const index = parseInt(btn.dataset.index)
        const id = btn.dataset.id
        if(confirm('确定要删除这条记录吗？')) {
            try {
                const row = records[index]
                await ipcRenderer.invoke(row._source === 'map' ? 'delete_map_record' : 'delete_record', { index: row._sourceIndex, id })
                loadRecords()  // 刷新表格
            } catch (e) {
                alert('删除失败: ' + e.message)
            }
        }
      })
    })

    // 给编辑按钮绑定事件
    document.querySelectorAll('.editBtn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const index = parseInt(btn.dataset.index)
        const id = btn.dataset.id
        let record = records[index]
        showEditModal(record, index, id)
      })
    })
  }

  const searchInput = document.getElementById('search')
  const searchField = document.getElementById('search-field')
  const recordSource = document.getElementById('record-source')
  const locationStatus = document.getElementById('location-status')
  let sortField = ''
  let sortDirection = 1
  function hasSpecificLocation(record) {
    return [record._raw.location, record._raw.title].some(value => typeof value === 'string' && value.trim())
  }
  function applyFilters() {
    const candidates = locationStatus.value === 'missing' ? records.filter(record => !hasSpecificLocation(record)) : records
    displayRecords(filterObservations(candidates, { query: searchInput.value, field: searchField.value,
      source: recordSource.value, sort: sortField, direction: sortDirection }))
  }
  searchInput.addEventListener('input', applyFilters)
  searchField.addEventListener('change', () => {
    searchInput.placeholder = searchField.value === 'all' ? '搜索全部字段，空格分隔多个关键词' : '输入' + searchField.selectedOptions[0].textContent + '关键词'
    applyFilters()
  })
  recordSource.addEventListener('change', applyFilters)
  locationStatus.addEventListener('change', applyFilters)

  // Edit Modal Logic
  let currentEditIndex = null
  let currentEditId = null

  function showEditModal(record, index, id) {
      currentEditIndex = index
      currentEditId = id
      
      // Create modal if not exists
      let modal = document.getElementById('edit-modal')
      if (!modal) {
          modal = document.createElement('div')
          modal.id = 'edit-modal'
          modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;justify-content:center;align-items:center;z-index:1000;'
          modal.innerHTML = `
            <div style="background:white;padding:20px;border-radius:8px;width:300px;">
                <h3 id="edit-heading">编辑记录</h3>
                <label id="edit-description-label" hidden>观察描述：<textarea id="edit-description"></textarea></label>
                <label>时间: <input id="edit-time" type="datetime-local" style="width:100%;margin-bottom:10px;"></label>
                <label>地点: <input id="edit-location" required style="width:100%;margin-bottom:10px;"></label>
                <label>数量: <input id="edit-count" type="number" style="width:100%;margin-bottom:10px;"></label>
                 <label>猫咪/品种: <input id="edit-species" style="width:100%;margin-bottom:10px;"></label>
                 <label>毛色/特征: <input id="edit-gender" style="width:100%;margin-bottom:10px;"></label>
                 <label>关联猫咪档案:
                     <select id="edit-cat" style="width:100%;margin-bottom:10px;">
                         <option value="">未关联</option>
                     </select>
                 </label>
                 <label>所在校园:
                     <select id="edit-area" style="width:100%;margin-bottom:10px;">
                         <option value="">不设置</option>
                     </select>
                 </label>
                <div style="text-align:right;">
                    <button onclick="closeEditModal()">取消</button>
                    <button onclick="saveEdit()" style="background:#d5eeeb;color:#286469;">保存</button>
                </div>
            </div>
          `
          document.body.appendChild(modal)
      }
      
      // Format time for datetime-local input (YYYY-MM-DDTHH:mm)
      const isMap = record._source === 'map'
      document.getElementById('edit-heading').textContent = isMap ? '编辑地图打卡' : '编辑观察记录'
      document.getElementById('edit-description-label').hidden = !isMap
      document.getElementById('edit-description').value = record.desc || ''
      let timeVal = record.time;
      if (timeVal && timeVal.includes('T') && timeVal.length > 16) {
          timeVal = timeVal.substring(0, 16);
      }
      document.getElementById('edit-time').value = timeVal
      document.getElementById('edit-location').value = hasSpecificLocation(record) ? record.location : ''
      document.getElementById('edit-count').value = record.count
      document.getElementById('edit-species').value = record.species
      document.getElementById('edit-gender').value = record.gender

      const catSelect = document.getElementById('edit-cat')
      catSelect.innerHTML = '<option value="">未关联</option>' +
          cats.map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`).join('')
      catSelect.value = record.cat_id ?? ''

      const areaSelect = document.getElementById('edit-area')
      areaSelect.innerHTML = '<option value="">不设置</option>' +
          campusOptions(areasData).map(o => `<option value="${escapeHtml(o.value)}">${escapeHtml(o.label)}</option>`).join('')
      areaSelect.value = record.area || ''

      modal.style.display = 'flex'
  }

  function closeEditModal() {
      document.getElementById('edit-modal').style.display = 'none'
  }

  async function saveEdit() {
      const locationInput = document.getElementById('edit-location')
      locationInput.value = locationInput.value.trim()
      if (!locationInput.reportValidity()) return
      if (!currentEditId && records[currentEditIndex] && records[currentEditIndex].id) {
          currentEditId = records[currentEditIndex].id;
      }

      const newRecord = {
          time: document.getElementById('edit-time').value,
          location: locationInput.value,
          count: document.getElementById('edit-count').value, // Keep as string to match add_record
          species: document.getElementById('edit-species').value,
          gender: document.getElementById('edit-gender').value,
          cat_id: document.getElementById('edit-cat').value || null,
          area: document.getElementById('edit-area').value
      }
      
      // Remove empty fields to avoid overwriting with null/empty if that's not intended
      // But here fields are required usually.
      
      try {
          const row = records[currentEditIndex]
          const payload = row._source === 'map' ? { ...row._raw, ...newRecord, title: newRecord.location, created_at: newRecord.time, desc: document.getElementById('edit-description').value } : newRecord
          const success = await ipcRenderer.invoke(row._source === 'map' ? 'update_map_record' : 'update_record', {
              id: currentEditId, 
              index: row._sourceIndex,
              record: payload
          })
          
          if (!success) {
              throw new Error('更新未生效 (可能记录不存在或ID不匹配)')
          }
          
          closeEditModal()
          loadRecords()
      } catch (e) {
          console.error('Update failed:', e);
          alert('更新失败: ' + e.message)
      }
  }

  // 排序功能
  document.querySelectorAll('th').forEach(th => {
    th.addEventListener('click', () => {
      const field = th.dataset.field
      if(!field) return;
      sortDirection = sortField === field ? -sortDirection : 1
      sortField = field
      document.querySelectorAll('th[data-field]').forEach(header => {
        header.setAttribute('aria-sort', header === th ? (sortDirection === 1 ? 'ascending' : 'descending') : 'none')
      })
      applyFilters()
    })
  })

  // 记录功能
  async function add_records(){ await ipcRenderer.invoke('open_add_record_window')}

  loadRecords()
  window.addEventListener('focus', () => {
    if (!publicScope || publicItems.size <= 100) loadRecords()
  })
</script>
</body>
</html>
