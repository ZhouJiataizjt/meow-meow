<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>猫咪档案</title>
    <link rel="icon" href="../assets/favicon.ico">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/icons.css">
    <style>
        .cats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .cats-header h2 { margin: 0; }
        .cats-header > button { flex: none; white-space: nowrap; }

        .cat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 16px;
        }

        .cat-card {
            background: var(--card-bg);
            border: 1px solid #eee3da;
            border-radius: 14px;
            padding: 18px;
            cursor: pointer;
            transition: transform .2s ease, box-shadow .2s ease;
        }
        .cat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--hover-shadow);
        }
        .cat-card-avatar {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            font-size: 26px;
            background: #ffe3d6;
            margin-bottom: 10px;
        }
        .cat-card-name { font-size: 16px; font-weight: 700; color: var(--primary-color); }
        .cat-card-species { margin-top: 3px; color: var(--text-color); font-size: 13px; }
        .cat-card-meta { margin-top: 10px; color: #8c7b71; font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }

        .empty-tip {
            color: #8c7b71;
            font-size: 14px;
            text-align: center;
            padding: 40px 0;
        }

        /* 弹窗 */
        .modal-mask {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(51, 41, 35, .45);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-box {
            background: white;
            border-radius: 14px;
            padding: 24px;
            width: 480px;
            max-width: 92vw;
            max-height: 86vh;
            overflow-y: auto;
            box-shadow: var(--hover-shadow);
        }
        .modal-box h3 { text-align: left; margin-bottom: 14px; }
        .modal-actions { text-align: right; margin-top: 14px; }
        .modal-actions button { margin-left: 8px; }
        .btn-danger { background: #c0392b; }
        .btn-plain { background: #95a5a6; }

        .timeline { margin-top: 8px; }
        .timeline-item {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px dashed #eee3da;
            font-size: 13px;
        }
        .timeline-item:last-child { border-bottom: none; }
        .timeline-date { flex: 0 0 108px; color: #8c7b71; }
        .timeline-body { flex: 1; min-width: 0; }
        .timeline-title { font-weight: 600; }
        .timeline-note { color: #6f5e54; margin-top: 2px; }
        .timeline-badge {
            display: inline-block;
            font-size: 11px;
            padding: 1px 8px;
            border-radius: 10px;
            background: #fff0e9;
            color: #b85538;
            margin-left: 6px;
        }

        .cat-info-row { font-size: 13px; margin: 6px 0; color: #4a3b33; }
        .cat-info-row b { color: var(--primary-color); }
        .cat-card-main { display: grid; grid-template-columns: 64px minmax(0, 1fr); align-items: center; gap: 14px; }
        .cats-page .cat-card-main .cat-card-avatar { width: 64px; height: 64px; margin: 0; }
        .cats-page .cat-card-name { overflow-wrap: anywhere; }
        .avatar-editor .avatar-options { display: flex; flex-wrap: wrap; gap: 7px; }
        .avatar-editor .avatar-choice { display: grid; place-items: center; min-height: 42px; width: 42px; margin: 0; padding: 3px; border: 1px solid var(--border-color); border-radius: 50%; background: white; }
        .avatar-editor .avatar-choice[aria-pressed="true"] { border: 2px solid var(--app-primary-dark); }
        .avatar-choice img { width: 100%; max-width: 34px; border-radius: 50%; }
        .avatar-editor .avatar-actions { margin-top: 8px; }
        @media (max-width: 460px) {
            .cats-page .cats-header { align-items: flex-start; gap: 12px; }
            .cats-page .avatar-editor { align-items: flex-start; gap: 10px; }
            .cats-page .avatar-editor > img { width: 54px; height: 54px; flex: 0 0 54px; }
        }
    </style>
    <link rel="stylesheet" href="../css/workspace.css">
    <link rel="stylesheet" href="../css/light.css">
</head>
<body class="cats-page">
    <div class="container" style="max-width: 100%;">
        <div class="cats-header">
            <div><h2>常驻猫咪</h2><p>熟悉的身影，每一只都有自己的故事。</p></div>
            <button onclick="openCatForm()">＋ 新建档案</button>
        </div>
        <div class="cat-search"><label for="cat-search">搜索猫咪档案</label><input id="cat-search" type="search" placeholder="搜索昵称、ID、品种、特征或备注"><span id="cat-search-count" aria-live="polite"></span></div>
        <div id="cat-grid" class="cat-grid"></div>
        <div id="empty-tip" class="empty-tip" style="display:none;">
            <img class="empty-art" src="../assets/cat-avatars/blue.svg" alt="">还没有猫咪档案。给常驻的那只猫建一个档案吧，之后的每次相遇都会记录在这里。
        </div>
    </div>

    <!-- 新建/编辑档案 -->
    <div class="modal-mask" id="cat-form-mask">
        <div class="modal-box">
            <h3 id="cat-form-title">新建猫咪档案</h3>
            <input type="hidden" id="cat-form-id">
            <div class="avatar-editor">
                <img id="cat-avatar-preview" src="../assets/cat-avatars/apricot.svg" alt="头像预览">
                <div>
                    <div id="avatar-options" class="avatar-options" role="group" aria-label="内置猫咪头像"></div>
                    <div class="avatar-actions">
                        <button type="button" class="secondary" onclick="selectCatAvatar()">上传头像</button>
                        <button type="button" class="secondary" onclick="setCatAvatar('')">自动分配</button>
                    </div>
                    <p id="cat-avatar-status" role="status"></p>
                </div>
            </div>
            <label>昵称：<input type="text" id="cat-form-name" placeholder="例如：大橘"></label>
            <label>品种/花色：<input type="text" id="cat-form-species" placeholder="例如：橘猫"></label>
            <label>外貌特征：<input type="text" id="cat-form-features" placeholder="例如：右耳缺角、脖子上有点白毛"></label>
            <label>备注：<textarea id="cat-form-notes" rows="3" placeholder="性格、喜好的食物、常出没位置……"></textarea></label>
            <div class="modal-actions">
                <button class="btn-plain" onclick="closeCatForm()">取消</button>
                <button onclick="saveCat()">保存</button>
            </div>
        </div>
    </div>

    <!-- 档案详情 + 相遇时间线 -->
    <div class="modal-mask" id="cat-detail-mask">
        <div class="modal-box">
            <h3 id="detail-name"></h3>
            <div id="detail-info"></div>
            <div style="margin-top:14px; font-weight:700; color:var(--primary-color);">相遇时间线</div>
            <div id="detail-timeline" class="timeline"></div>
            <div class="modal-actions">
                <button class="btn-danger" onclick="deleteCat()">删除档案</button>
                <button class="btn-plain" onclick="closeCatDetail()">关闭</button>
                <button onclick="editCurrentCat()">编辑</button>
            </div>
        </div>
    </div>

<script>
    const { ipcRenderer } = require('electron')
    const { escapeHtml, parseRecordTime } = require('../../backend/utils')
    const { avatarPresets, catAvatarUrl, defaultCatAvatar } = require('../../backend/cat_avatars')
    let cats = []
    let records = []
    let mapRecords = []
    let currentCatId = null
    let currentAvatar = ''
    function showAvatar(image, value, key) {
        image.onerror = () => {
            image.onerror = null
            image.src = defaultCatAvatar(key)
        }
        image.src = catAvatarUrl(value, key)
    }
    const avatarOptions = document.getElementById('avatar-options')
    for (const preset of avatarPresets) {
        const option = document.createElement('button')
        option.type = 'button'
        option.className = 'avatar-choice'
        option.dataset.avatar = preset.id
        option.title = preset.name
        option.setAttribute('aria-label', preset.name)
        const image = document.createElement('img')
        image.alt = ''
        image.src = catAvatarUrl(preset.id)
        option.append(image)
        option.addEventListener('click', () => setCatAvatar(preset.id))
        avatarOptions.append(option)
    }
    function setCatAvatar(value) {
        currentAvatar = value
        showAvatar(document.getElementById('cat-avatar-preview'), value, document.getElementById('cat-form-id').value)
        for (const option of avatarOptions.children) option.setAttribute('aria-pressed', String(option.dataset.avatar === value))
        const preset = avatarPresets.find(item => item.id === value)
        document.getElementById('cat-avatar-status').textContent = preset?.name || (value ? '自选图片' : '自动分配头像')
    }
    async function selectCatAvatar() {
        try { const selected = await ipcRenderer.invoke('select-image'); if (selected) { const cropped = await require('../js/cat_avatar_crop').cropCatAvatar(selected); if (cropped) setCatAvatar(cropped) } }
        catch (error) { document.getElementById('cat-avatar-status').textContent = '选择头像失败：' + error.message }
    }
    document.getElementById('cat-search').addEventListener('input', renderGrid)

    async function loadAll() {
        try {
            const [nextCats, nextRecords, nextMapRecords] = await Promise.all([
                ipcRenderer.invoke('get_cats'), ipcRenderer.invoke('get_records'), ipcRenderer.invoke('get_own_map_records')
            ])
            cats = nextCats || []
            records = nextRecords || []
            mapRecords = nextMapRecords || []
            renderGrid()
        } catch {
            document.getElementById('cat-search-count').textContent = '读取档案失败，请稍后重试。'
        }
    }

    function sightingsOf(catId) {
        const items = []
        for (const r of records) {
            if (String(r.cat_id ?? '') !== String(catId)) continue
            items.push({
                time: parseRecordTime(r),
                title: `${r.location || '未知地点'}（${r.species || '未知品种'} × ${r.count || 1}）`,
                note: r.gender || '',
                badge: '观察记录'
            })
        }
        for (const r of mapRecords) {
            if (String(r.cat_id ?? '') !== String(catId)) continue
            items.push({
                time: parseRecordTime(r),
                title: r.title || '地图打卡',
                note: r.desc || '',
                badge: '地图打卡', record: r
            })
        }
        return items.sort((a, b) => b.time - a.time)
    }

    function renderGrid() {
        const grid = document.getElementById('cat-grid')
        const tip = document.getElementById('empty-tip')
        grid.innerHTML = ''
        const query = document.getElementById('cat-search').value.trim().toLocaleLowerCase()
        const filtered = cats.filter(cat => [cat.name,cat.id,cat.species,cat.features,cat.notes].some(v => String(v || '').toLocaleLowerCase().includes(query)))
        document.getElementById('cat-search-count').textContent = `共 ${cats.length} 只 · 当前 ${filtered.length} 只`
        tip.style.display = filtered.length === 0 ? 'block' : 'none'
        tip.innerHTML = `<img class="empty-art" src="../assets/cat-avatars/blue.svg" alt="">${cats.length ? '没有符合条件的猫咪，试试其他关键词。' : '还没有猫咪档案，先给熟悉的猫咪建一个档案吧。'}`

        filtered.forEach(cat => {
            const sightings = sightingsOf(cat.id)
            const lastTime = sightings.length > 0 && sightings[0].time > 0
                ? new Date(sightings[0].time).toLocaleDateString()
                : null
            const card = document.createElement('div')
            card.className = 'cat-card'
            card.tabIndex = 0
            card.setAttribute('role', 'button')
            card.setAttribute('aria-label', `查看${cat.name}的档案`)
            card.onkeydown = event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); showCatDetail(cat.id) } }
            card.onclick = () => showCatDetail(cat.id)
            card.innerHTML = `
                <div class="cat-card-main">
                    <div class="cat-card-avatar"><img alt=""></div>
                    <div>
                        <div class="cat-card-name">${escapeHtml(cat.name)}</div>
                        <div class="cat-card-species">${escapeHtml(cat.species || '未知品种')}</div>
                        <div class="cat-card-id">ID：${escapeHtml(cat.id)}</div>
                    </div>
                </div>
                <div class="cat-card-meta">
                    <span>相遇 ${sightings.length} 次</span>
                    ${lastTime ? `<span>最近：${escapeHtml(lastTime)}</span>` : ''}
                </div>
            `
            showAvatar(card.querySelector('.cat-card-avatar img'), cat.avatar, cat.id)
            grid.appendChild(card)
        })
    }

    function showCatDetail(catId) {
        const cat = cats.find(c => String(c.id) === String(catId))
        if (!cat) return
        currentCatId = cat.id

        document.getElementById('detail-name').textContent = cat.name
        const sightings = sightingsOf(cat.id)
        const infoHtml = `
            <img class="detail-cat-avatar" alt="">
            <div class="cat-info-row" style="overflow-wrap:anywhere;"><b>固定 ID：</b>${escapeHtml(cat.id)}</div>
            <div class="cat-info-row"><b>品种/花色：</b>${escapeHtml(cat.species || '未知')}</div>
            <div class="cat-info-row"><b>外貌特征：</b>${escapeHtml(cat.features || '暂无记录')}</div>
            <div class="cat-info-row"><b>备注：</b>${escapeHtml(cat.notes || '暂无')}</div>
        `
        const info = document.getElementById('detail-info')
        info.innerHTML = infoHtml
        showAvatar(info.querySelector('.detail-cat-avatar'), cat.avatar, cat.id)

        const timeline = document.getElementById('detail-timeline')
        if (sightings.length === 0) {
            timeline.innerHTML = '<div class="empty-tip" style="padding:16px 0;">还没有关联的相遇记录。在“添加记录”或地图打卡时选择关联这个档案即可。</div>'
        } else {
            timeline.innerHTML = sightings.map((s, i) => {
                const dateStr = s.time > 0 ? new Date(s.time).toLocaleString() : '时间未知'
                return `
                    <div class="timeline-item">
                        <div class="timeline-date">${escapeHtml(dateStr)}</div>
                        <div class="timeline-body">
                            <div class="timeline-title">${escapeHtml(s.title)}<span class="timeline-badge">${s.badge}</span></div>
                            ${s.note ? `<div class="timeline-note">${escapeHtml(s.note)}</div>` : ''}
                            ${Number.isFinite(s.record?.lat) && Number.isFinite(s.record?.lng) ? `<button class="timeline-locate secondary" data-sighting="${i}">定位到地图</button>` : ""}
                        </div>
                    </div>
                `
            }).join('')
        }
        timeline.querySelectorAll('[data-sighting]').forEach(button => button.onclick = () => {
            const record = sightings[Number(button.dataset.sighting)].record
            const target = { id: record.id, lat: record.lat, lng: record.lng }
            if (window.parent !== window) window.parent.postMessage({ type: 'locate-record', record: target }, '*')
            else ipcRenderer.invoke('open_map_window', target).catch(() => alert('打开地图失败，请稍后重试。'))
        })
        document.getElementById('cat-detail-mask').style.display = 'flex'
    }

    function closeCatDetail() {
        document.getElementById('cat-detail-mask').style.display = 'none'
        currentCatId = null
    }

    function openCatForm(cat) {
        document.getElementById('cat-form-title').textContent = cat ? '编辑猫咪档案' : '新建猫咪档案'
        document.getElementById('cat-form-id').value = cat ? cat.id : ''
        setCatAvatar(cat ? cat.avatar || '' : 'builtin:cat')
        document.getElementById('cat-form-name').value = cat ? (cat.name || '') : ''
        document.getElementById('cat-form-species').value = cat ? (cat.species || '') : ''
        document.getElementById('cat-form-features').value = cat ? (cat.features || '') : ''
        document.getElementById('cat-form-notes').value = cat ? (cat.notes || '') : ''
        document.getElementById('cat-form-mask').style.display = 'flex'
    }

    function closeCatForm() {
        document.getElementById('cat-form-mask').style.display = 'none'
    }

    function editCurrentCat() {
        const cat = cats.find(c => String(c.id) === String(currentCatId))
        if (!cat) return
        closeCatDetail()
        openCatForm(cat)
    }

    async function saveCat() {
        const name = document.getElementById('cat-form-name').value.trim()
        if (!name) {
            alert('请给猫咪起个名字')
            return
        }
        const cat = {
            name,
            avatar: currentAvatar,
            species: document.getElementById('cat-form-species').value.trim(),
            features: document.getElementById('cat-form-features').value.trim(),
            notes: document.getElementById('cat-form-notes').value.trim()
        }
        const id = document.getElementById('cat-form-id').value
        try {
            if (id) {
                const saved = await ipcRenderer.invoke('update_cat', { id, cat })
                if (saved === false) throw new Error('找不到这份猫咪档案')
            } else {
                await ipcRenderer.invoke('add_cat', cat)
            }
            closeCatForm()
            loadAll()
        } catch (e) {
            alert('保存失败：' + e.message)
        }
    }

    async function deleteCat() {
        if (!currentCatId) return
        if (!confirm('确定删除这个档案吗？观察记录本身不会被删除，只会解除关联。')) return
        try {
            await ipcRenderer.invoke('delete_cat', currentCatId)
            closeCatDetail()
            loadAll()
        } catch (e) {
            alert('删除失败：' + e.message)
        }
    }

    loadAll()
    window.addEventListener('focus', loadAll)
</script>
</body>
</html>
