<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>今日寻猫</title>
    <link rel="icon" href="../assets/favicon.ico">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/icons.css">
    <link rel="stylesheet" href="../css/light.css">
</head>
<body class="discovery-page">
    <div class="container">
        
        <div class="workspace-intro"><h2>今天，去哪里遇见猫</h2><p>告诉我们你所在的地区，找一个适合观察的地方。</p></div>
        <div class="form-group">
            <label for="area_input">你所在的地区</label>
            <input id="area_input" type="text" placeholder="请输入你所在的地区（如：杭州西湖）">
        </div>
        <div class="text-center">
            <button onclick="recommender()"><img class="ui-icon " src="../assets/星光.svg" alt="" aria-hidden="true"> 获取推荐</button>
        </div>
        
        <div id="result" class="mt-20" style="white-space: pre-wrap; line-height: 1.6; background: #f9f9f9; padding: 15px; border-radius: 5px; min-height: 100px;"></div>
    </div>

    <script>
        const { ipcRenderer } = require('electron')
        window.ipcRenderer = ipcRenderer
        async function recommender(){
            const area = document.getElementById("area_input").value.trim()
            const resultElement = document.getElementById("result")
            if (!area) {
                resultElement.innerText = "请输入你所在的地区"
                return
            }
                resultElement.innerText = "正在为您生成今日寻猫推荐，请稍候..."
            try {
                const result = await ipcRenderer.invoke('todays_recommend', area)
                resultElement.innerText = result
            } catch (err) {
                resultElement.innerText = `调用出错：${err}`
            }
        }
    </script>
</body>
</html>
