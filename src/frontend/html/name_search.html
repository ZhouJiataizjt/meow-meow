<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>按名称检索</title>
    <link rel="icon" href="../assets/favicon.ico">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/icons.css">
    <link rel="stylesheet" href="../css/light.css">
</head>
<body class="discovery-page">
    <div class="container">
        <button class="back-btn" onclick="goBack()" title="返回">返回</button>
        
        <div class="workspace-intro"><h2>认识一只猫</h2><p>从名字或品种开始，了解它的特点与习性。</p></div>
        <div class="form-group">
            <label for="name_input">猫咪名称或品种</label>
            <input id="name_input" type="text" placeholder="请输入猫咪的名称或品种（如：橘猫）">
        </div>
        <div class="text-center">
            <button onclick="name_searcher()"><img class="ui-icon " src="../assets/放大.svg" alt="" aria-hidden="true"> 开始搜索</button>
        </div>
        
        <div id="name_result" class="mt-20" style="white-space: pre-wrap; line-height: 1.6; background: #f9f9f9; padding: 15px; border-radius: 5px; min-height: 100px;"></div>
    </div>

    <script>
          const { ipcRenderer } = require('electron')
          window.ipcRenderer = ipcRenderer

          async function name_searcher() {
              const name = document.getElementById("name_input").value.trim()
              const resultElement = document.getElementById("name_result")

              if (!name) {
                  resultElement.innerText = "请输入猫咪的名称或品种"
                  return
              }

              // 显示加载提示
              resultElement.innerText = "正在检索中，请稍候..."

              try {
                  const result = await ipcRenderer.invoke('name_searcher', name)
                  resultElement.innerText = result
              } catch (err) {
                  resultElement.innerText = `调用出错：${err}`
              }
          }

          async function goBack() {
             if (window.parent && window.parent !== window && window.parent.appNavigate) {
                 window.parent.appNavigate('guide')
                 return
             }
             await ipcRenderer.invoke('search_cat_newpage')
         }
    </script>
</body>
</html>
