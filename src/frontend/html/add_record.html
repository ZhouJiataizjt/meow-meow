<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>添加猫咪记录</title>
    <link rel="icon" href="../assets/favicon.ico">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/icons.css">
    <style>
        /* Extend common styles to other input types */
        input[type="datetime-local"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            border-color: var(--accent-color);
            outline: none;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            margin-top: 10px;
        }
    </style>
    <link rel="stylesheet" href="../css/light.css">
</head>
<body class="form-page">
    <div class="container">
        <h2>添加猫咪记录</h2>
        <form id="recordForm">
            <label>发现时间：
                <input type="datetime-local" id="time" required>
            </label>
            <label>地点：
                <input type="text" id="location" required>
            </label>
            <label>数量：
                <input type="number" id="count" min="1" step="1" value="1" required>
            </label>
            <label>猫咪/品种：
                <input type="text" id="species" required>
            </label>
            <label>毛色/特征：
                <input type="text" id="gender" required>
            </label>
            <div id="observation-cat-picker"></div>
            <label>所在校园（可选）：
                <select id="area"></select>
            </label>
            <div style="display:flex; gap:8px; align-items:center; margin-bottom:10px;">
                <button type="button" id="ai-recognize-btn" style="flex:1; background:#6c5ce7;"><img class="ui-icon " src="../assets/照相机.svg" alt="" aria-hidden="true"> 拍照识别品种</button>
            </div>
            <div id="ai-result" style="display:none; font-size:12px; color:#666; background:#f6f3ef; border-radius:8px; padding:8px 10px; margin-bottom:10px; white-space:pre-wrap; max-height:110px; overflow-y:auto;"></div>
            <p id="publication-note" hidden>提交后，地点和观察内容会出现在公开观察里。</p>
            <button type="submit" style="width: 100%; margin-top: 10px;">提交</button>
        </form>
    </div>

<script>
    const { ipcRenderer } = require('electron')
    const { parseRecordTime } = require('../../backend/utils')
    const { loadAreasData, campusOptions } = require('../../backend/areas')

    const { createCatPicker } = require('../js/cat_picker')
    const catPicker = createCatPicker(document.getElementById('observation-cat-picker'), ipcRenderer)
    catPicker.setValue()

    // 所在校园下拉：默认带出最近一次地图打卡的校园
    async function loadAreaOptions() {
        const select = document.getElementById('area')
        const options = campusOptions(loadAreasData())
        select.innerHTML = '<option value="">不设置</option>' +
            options.map(o => `<option value="${o.value.replace(/"/g, '&quot;')}">${o.label.replace(/</g, '&lt;').replace(/&/g, '&amp;')}</option>`).join('')
        try {
            const mapRecords = (await ipcRenderer.invoke('get_map_records')) || []
            const latestWithArea = mapRecords
                .filter(r => r.area)
                .sort((a, b) => parseRecordTime(b) - parseRecordTime(a))[0]
            if (latestWithArea) select.value = latestWithArea.area
        } catch (e) { /* 默认值获取失败不影响新增 */ }
    }
    loadAreaOptions()

    // AI 识别：选择一张猫咪照片，由多模态大模型识别品种并回填表单
    document.getElementById('ai-recognize-btn').addEventListener('click', async () => {
        const resultBox = document.getElementById('ai-result')
        const imagePath = await ipcRenderer.invoke('select-image', false)
        if (!imagePath) return
        resultBox.style.display = 'block'
        resultBox.textContent = '正在识别中，请稍候...'
        const result = await ipcRenderer.invoke('recognize_cat_image', imagePath)
        if (!result.ok) {
            resultBox.textContent = '识别失败：' + result.message
            return
        }
        resultBox.textContent = result.text
        // 尽力自动回填：品种：xxx / 毛色特征：xxx
        const breedMatch = result.text.match(/品种[:：]\s*(.+)/)
        if (breedMatch) document.getElementById('species').value = breedMatch[1].split(/[，,；;。]/)[0].trim()
        const colorMatch = result.text.match(/毛色特征[:：]\s*(.+)/)
        if (colorMatch) document.getElementById('gender').value = colorMatch[1].split(/[，,；;。]/)[0].trim()
    })

    const now = new Date()
    document.getElementById('time').value = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16)
    const form = document.getElementById('recordForm')
    const locationInput = document.getElementById('location')
    ipcRenderer.invoke('is-cloud-enabled').then(enabled => {
        document.getElementById('publication-note').hidden = !enabled
    })
    form.addEventListener('submit', async (e) => {
        e.preventDefault()
        locationInput.value = locationInput.value.trim()
        if (!locationInput.reportValidity()) return
        try { catPicker.validate() } catch (error) { alert(error.message); return }
        const newRecord = {
            time: document.getElementById('time').value,
            location: locationInput.value,
            count: document.getElementById('count').value,
            species: document.getElementById('species').value,
            gender: document.getElementById('gender').value,
            cat_id: catPicker.value,
            area: document.getElementById('area').value || ''
        }
        try {
            const saved = await ipcRenderer.invoke('add_record', newRecord)
            if (!saved) throw new Error('记录未保存，请重试')
            window.close() // 关闭弹窗
        } catch (err) {
            console.error(err);
            alert('添加失败：' + err.message);
        }
    })
</script>
</body>
</html>
