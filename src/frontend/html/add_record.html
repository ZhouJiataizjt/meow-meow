<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>添加猫咪记录</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        /* Extend common styles to other input types */
        input[type="datetime-local"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            border-color: var(--accent-color);
            outline: none;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>添加猫咪记录</h2>
        <form id="recordForm">
            <label>发现时间：
                <input type="datetime-local" id="time" required>
            </label>
            <label>地点：
                <input type="text" id="location" required>
            </label>
            <label>数量：
                <input type="number" id="count" required>
            </label>
            <label>猫咪/品种：
                <input type="text" id="species" required>
            </label>
            <label>毛色/特征：
                <input type="text" id="gender" required>
            </label>
            <label>关联猫咪档案：
                <select id="cat_id"></select>
            </label>
            <div style="display:flex; gap:8px; align-items:center; margin-bottom:10px;">
                <button type="button" id="ai-recognize-btn" style="flex:1; background:#6c5ce7;">📷 拍照识别品种</button>
            </div>
            <div id="ai-result" style="display:none; font-size:12px; color:#666; background:#f6f3ef; border-radius:8px; padding:8px 10px; margin-bottom:10px; white-space:pre-wrap; max-height:110px; overflow-y:auto;"></div>
            <button type="submit" style="width: 100%; margin-top: 10px;">提交</button>
        </form>
    </div>

<script>
    const { ipcRenderer } = require('electron')

    // 档案下拉框：可把这条记录归到某只常驻猫咪名下
    async function loadCatOptions() {
        const select = document.getElementById('cat_id')
        try {
            const cats = await ipcRenderer.invoke('get_cats') || []
            select.innerHTML = '<option value="">不关联档案</option>' +
                cats.map(c => `<option value="${String(c.id).replace(/"/g, '&quot;')}">${String(c.name).replace(/</g, '&lt;').replace(/&/g, '&amp;')}</option>`).join('')
        } catch (e) {
            select.innerHTML = '<option value="">不关联档案</option>'
        }
    }
    loadCatOptions()

    // AI 识别：选择一张猫咪照片，由多模态大模型识别品种并回填表单
    document.getElementById('ai-recognize-btn').addEventListener('click', async () => {
        const resultBox = document.getElementById('ai-result')
        const imagePath = await ipcRenderer.invoke('select-image', false)
        if (!imagePath) return
        resultBox.style.display = 'block'
        resultBox.textContent = '正在识别中，请稍候...'
        const result = await ipcRenderer.invoke('recognize_cat_image', imagePath)
        if (!result.ok) {
            resultBox.textContent = '识别失败：' + result.message
            return
        }
        resultBox.textContent = result.text
        // 尽力自动回填：品种：xxx / 毛色特征：xxx
        const breedMatch = result.text.match(/品种[:：]\s*(.+)/)
        if (breedMatch) document.getElementById('species').value = breedMatch[1].split(/[，,；;。]/)[0].trim()
        const colorMatch = result.text.match(/毛色特征[:：]\s*(.+)/)
        if (colorMatch) document.getElementById('gender').value = colorMatch[1].split(/[，,；;。]/)[0].trim()
    })

    const form = document.getElementById('recordForm')
    form.addEventListener('submit', async (e) => {
        e.preventDefault()
        const newRecord = {
            time: document.getElementById('time').value,
            location: document.getElementById('location').value,
            count: document.getElementById('count').value,
            species: document.getElementById('species').value,
            gender: document.getElementById('gender').value,
            cat_id: document.getElementById('cat_id').value || null
        }
        try {
            await ipcRenderer.invoke('add_record', newRecord)
            window.close() // 关闭弹窗
        } catch (err) {
            console.error(err);
            alert('添加失败：' + err.message);
        }
    })
</script>
</body>
</html>
