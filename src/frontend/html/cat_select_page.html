<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>猫咪图鉴</title>
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>
    <div class="container">
        <div class="grid-container">
            <div style="text-align: center;">
                <button class="w-100" onclick="area_search()" style="height: 100px; font-size: 18px;">
                    🌍<br>按地区查询猫咪
                </button>
            </div>
            <div style="text-align: center;">
                <button class="w-100" onclick="name_search()" style="height: 100px; font-size: 18px;">
                    🐱<br>按名称/品种查询
                </button>
            </div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron')
        window.ipcRenderer = ipcRenderer

        async function area_search() {
            if (window.parent && window.parent !== window && window.parent.appNavigate) {
                window.parent.appNavigate('guide-area')
                return
            }
            await ipcRenderer.invoke('area_search')
        }

        async function name_search() {
            if (window.parent && window.parent !== window && window.parent.appNavigate) {
                window.parent.appNavigate('guide-name')
                return
            }
            await ipcRenderer.invoke('name_search')
        }
    </script>
</body>
</html>
