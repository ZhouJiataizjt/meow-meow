<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>按地区检索</title>
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="goBack()" title="返回">⬅</button>
        
        <h3>🌍 地区猫咪检索</h3>
        <div class="form-group">
            <input id="area_input" type="text" placeholder="请输入要检索的地区（如：小区、校园或公园）">
        </div>
        <div class="text-center">
            <button onclick="area_searcher()">🔍 开始搜索</button>
        </div>
        
        <div id="area_result" class="mt-20" style="white-space: pre-wrap; line-height: 1.6; background: #f9f9f9; padding: 15px; border-radius: 5px; min-height: 100px;"></div>
    </div>

    <script>
         const { ipcRenderer } = require('electron')
         window.ipcRenderer = ipcRenderer

         async function area_searcher() {
             const area = document.getElementById("area_input").value.trim()
             const resultElement = document.getElementById("area_result")

             if (!area) {
                 resultElement.innerText = "请输入要检索的地区"
                 return
             }

             // 显示加载提示
             resultElement.innerText = "正在检索中，请稍候..."

             try {
                 const result = await ipcRenderer.invoke('area_searcher', area)
                 resultElement.innerText = result
             } catch (err) {
                 resultElement.innerText = `调用出错：${err}`
             }
         }

         async function goBack() {
             await ipcRenderer.invoke('search_cat_newpage')
         }
    </script>
</body>
</html>
