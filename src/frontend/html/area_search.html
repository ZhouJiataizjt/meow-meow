<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>按地区检索</title>
    <link rel="icon" href="../assets/favicon.ico">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/icons.css">
    <link rel="stylesheet" href="../css/light.css">
</head>
<body class="discovery-page">
    <div class="container">
        <button class="back-btn" onclick="goBack()" title="返回">返回</button>
        
        <div class="workspace-intro"><h2>探索一片区域</h2><p>输入你熟悉的校园、小区或公园，发现附近的猫咪。</p></div>
        <div class="form-group">
            <label for="area_input">地区名称</label>
            <input id="area_input" type="text" placeholder="请输入要检索的地区（如：小区、校园或公园）">
        </div>
        <div class="text-center">
            <button onclick="area_searcher()"><img class="ui-icon " src="../assets/放大.svg" alt="" aria-hidden="true"> 开始搜索</button>
        </div>
        
        <div id="area_result" class="mt-20" style="white-space: pre-wrap; line-height: 1.6; background: #f9f9f9; padding: 15px; border-radius: 5px; min-height: 100px;"></div>
    </div>

    <script>
         const { ipcRenderer } = require('electron')
         window.ipcRenderer = ipcRenderer

         async function area_searcher() {
             const area = document.getElementById("area_input").value.trim()
             const resultElement = document.getElementById("area_result")

             if (!area) {
                 resultElement.innerText = "请输入要检索的地区"
                 return
             }

             // 显示加载提示
             resultElement.innerText = "正在检索中，请稍候..."

             try {
                 const result = await ipcRenderer.invoke('area_searcher', area)
                 resultElement.innerText = result
             } catch (err) {
                 resultElement.innerText = `调用出错：${err}`
             }
         }

         async function goBack() {
             if (window.parent && window.parent !== window && window.parent.appNavigate) {
                 window.parent.appNavigate('guide')
                 return
             }
             await ipcRenderer.invoke('search_cat_newpage')
         }
    </script>
</body>
</html>
