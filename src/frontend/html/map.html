<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>喵喵地图</title>
    <link rel="icon" href="../assets/favicon.ico">
    <link rel="stylesheet" href="../vendor/leaflet.css" />
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/icons.css">
    <style>
        /* Override common.css for full screen map */
        body {
            padding: 0 !important;
            display: block !important;
            margin: 0 !important;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        
        #map { height: 100%; width: 100%; background-color: #f0f0f0; z-index: 1; }

        /* 选点时让点击穿过校园多边形和猫咪标记，统一交给地图处理。 */
        #map.location-picking,
        #map.location-picking .leaflet-pane,
        #map.location-picking .leaflet-pane * {
            cursor: crosshair !important;
        }
        #map.location-picking .leaflet-interactive {
            pointer-events: none !important;
        }
        #map.location-picking .leaflet-popup-pane,
        #map.location-picking .leaflet-tooltip-pane {
            visibility: hidden;
            pointer-events: none;
        }

        .custom-popup .leaflet-popup-content-wrapper {
            border-radius: 8px;
            padding: 0;
            overflow: hidden;
        }
        .custom-popup .leaflet-popup-content {
            margin: 0;
            width: 200px !important;
        }
        .popup-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            display: block;
        }
        .popup-info {
            padding: 10px;
        }
        .popup-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
        .popup-desc {
            font-size: 12px;
            color: #666;
        }
        
        #add-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
             background: #367f83;
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        #add-btn:hover { background: #bd6248; }

        /* Records List Button */
        #list-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 10px 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            cursor: pointer;
            font-weight: bold;
            color: #2c3e50;
            border: none;
        }
        #list-btn:hover { background: #f9f9f9; }

        /* Heatmap toggle button */
        #heat-btn {
            position: absolute;
            top: 64px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 8px 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            cursor: pointer;
            font-weight: bold;
            color: #2c3e50;
            border: none;
            font-size: 13px;
        }
        #heat-btn.active {
            background: #367f83;
            color: white;
        }

        /* Campus areas toggle button */
        #areas-btn {
            position: absolute;
            top: 108px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 8px 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            cursor: pointer;
            font-weight: bold;
            color: #2c3e50;
            border: none;
            font-size: 13px;
        }
        #areas-btn.active {
            background: #7ea1b3;
            color: white;
        }

        /* 校园汇总弹窗 */
        .campus-summary { font-size: 13px; line-height: 1.7; color: #4a3b33; }
        .campus-summary-title { font-weight: 700; color: var(--primary-color); margin-bottom: 4px; font-size: 14px; }
        .campus-summary button {
            width: 100%;
            margin-top: 8px;
            background: #367f83;
            color: white;
            font-size: 12px;
            min-height: 30px;
        }

        /* 猫点下钻返回条 */
        /* 校园边界永久标签 */
        .campus-label {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid #e3d5cb;
            color: #6f5e54;
            font-weight: 600;
            font-size: 11px;
            box-shadow: none;
            padding: 2px 8px;
        }
        .campus-label::before { display: none; }

        /* 弹窗里的位置识别预览 */
        .area-preview {
            font-size: 12px;
            color: #6f5e54;
            background: #f6f3ef;
            border: 1px dashed #e3d5cb;
            border-radius: 6px;
            padding: 6px 10px;
            margin-bottom: 12px;
        }
        .popup-area {
            font-size: 11px;
            color: #7ea1b3;
            margin-top: 4px;
        }

        /* Offline notice overlay */
        #offline-notice {
            display: none;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1200;
            background: #fff8e1;
            border: 1px solid #f0d47a;
            color: #7a5c00;
            padding: 10px 18px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            font-size: 13px;
            align-items: center;
            gap: 10px;
            max-width: 80%;
        }
        #offline-notice button {
            background: transparent;
            color: #7a5c00;
            border: 1px solid #d4b95e;
            padding: 2px 10px;
            font-size: 12px;
            min-height: 24px;
        }

        /* 简单的模态框样式 */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            max-height: 88vh;
            overflow-y: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
        .btn-group { text-align: right; margin-top: 20px; }
        button { padding: 8px 15px; cursor: pointer; border-radius: 4px; border: none; }
        .btn-cancel { background: #e0e0e0; margin-right: 10px; }
        .btn-save { background: #367f83; color: white; }

        .user-tag { font-size: 12px; color: #666; display: flex; align-items: center; margin-top: 5px; }

        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 3000; justify-content: center; align-items: center; }
        #lightbox img { max-width: 90%; max-height: 90%; object-fit: contain; }
    </style>
    <link rel="stylesheet" href="../css/workspace.css">
    <link rel="stylesheet" href="../css/light.css">
    <link rel="stylesheet" href="../css/map-detail.css">
    <link rel="stylesheet" href="../css/map-observations.css">
</head>
<body class="map-page">

<div class="map-tools" role="group" aria-label="地图工具">
<button id="list-btn" onclick="showRecordsList()">观察列表</button>
<button id="heat-btn" onclick="toggleHeatmap()" title="切换热力图">热力图</button>
<button id="areas-btn" class="active" onclick="toggleCampusAreas()" title="显示/隐藏高校范围">校园范围</button>

</div>
<div id="offline-notice">
    <span>地图瓦片加载失败：地图底图需要联网，但你的记录数据仍在本地可用。</span>
    <button onclick="document.getElementById('offline-notice').style.display='none'">知道了</button>
</div>

<section id="records-list-container" aria-labelledby="observation-list-title">
    <header class="observations-header">
        <div class="observations-header-inner">
            <button id="list-back" class="observations-back" type="button" onclick="hideRecordsList()">返回地图</button>
            <h2 id="observation-list-title">观察列表</h2>
        </div>
    </header>
    <div class="observations-main">
        <div class="observations-toolbar">
            <div class="observations-search">
                <span class="observations-search-icon" aria-hidden="true"></span>
                <input type="search" id="list-search-input" aria-label="搜索观察" placeholder="搜索猫咪、地点或描述" oninput="onFilterChanged()">
            </div>
            <button id="list-filter-toggle" class="observations-filter-toggle" type="button" aria-expanded="false" aria-controls="list-filters">筛选<span id="list-filter-count" hidden></span></button>
        </div>
        <section id="list-filters" class="observations-filters" aria-label="观察筛选" hidden>
            <label class="observation-filter-field">区域<select id="area-filter" onchange="onFilterChanged()"></select></label>
            <label class="observation-filter-field">距离<select id="distance-filter" onchange="onFilterChanged()">
                <option value="0">不限距离</option>
                <option value="500">500 米内</option>
                <option value="1000">1 公里内</option>
                <option value="3000">3 公里内</option>
            </select></label>
            <label class="observation-filter-field">开始日期<input type="date" id="date-start" onchange="onFilterChanged()"></label>
            <label class="observation-filter-field">结束日期<input type="date" id="date-end" onchange="onFilterChanged()"></label>
            <div class="observation-filter-options">
                <label><input type="checkbox" id="filter-mine-only" onchange="onFilterChanged()">只看我的</label>
                <label title="按与地图视野中心的距离排序"><input type="checkbox" id="distance-sort" onchange="onFilterChanged()">按距离排序</label>
                <label title="把 50 米内的打卡显示为同一位置"><input type="checkbox" id="cluster-mode" onchange="onFilterChanged()">按位置聚合</label>
                <button id="list-reset" type="button" class="observations-reset" onclick="clearObservationFilters()" disabled>重置筛选</button>
            </div>
        </section>
        <div class="observations-summary">
            <p id="list-results-count" role="status"></p>
            <button id="list-cluster-back" type="button" class="observations-reset" onclick="leaveObservationCluster()" hidden>返回全部位置</button>
        </div>
        <div id="list-content" class="observations-results"></div>
    </div>
</section>

<div id="map"></div>
<div id="location-hint" role="status" style="display:none; position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:1100; background:#fff4df; padding:12px 18px; border-radius:12px; box-shadow:0 3px 16px #0002;">
    请点击地图，选择猫咪出现的位置。
    <button type="button" onclick="cancelLocationPicking()">返回表单</button>
</div>
<button id="add-btn" onclick="startAddingMode()" title="新增观察" aria-label="新增观察">+</button>

<!-- Add Record Modal -->
<div id="modal">
    <div class="modal-content">
        <h3 id="record-modal-title">新增观察</h3>
        <p id="observation-visibility" style="color:#716259; font-size:13px;">登录后发布，地图观察和照片对所有人公开。</p>
        <div id="record-area" class="area-preview"> 请先选择观察位置</div>
        <button type="button" onclick="pickObservationLocation()">在地图上选择位置</button>
        <div class="form-group">

        <div class="form-group">

        <div class="form-group">

</div>

<div id="detail-modal">
    <div class="detail-content" role="dialog" aria-modal="true" aria-labelledby="detail-title">
        <header class="detail-header">
            <img id="detail-avatar" class="detail-avatar" alt="">

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()">
    <img src="">
</div>

<script src="../vendor/leaflet.js"></script>
<script src="../vendor/leaflet-heat.js"></script>
<script>
    const { ipcRenderer } = require('electron')
  if (window.parent !== window) document.body.classList.add('embedded-page');
    const { escapeHtml, safeResourceUrl, detectArea, nearestAreaLabel, formatArea, mainRingOf, haversineMeters, clusterRecords, parseRecordTime } = require('../../backend/utils');
    const { catAvatarUrl, defaultCatAvatar } = require('../../backend/cat_avatars');
    const { loadAreasData, campusOptions } = require('../../backend/areas');

    // ==========================================
    // 校园范围图层与位置判定（数据加载后已带 GCJ-02 坐标 polygons_gcj02）
    // ==========================================
    const { createCatPicker } = require('../js/cat_picker');
    const catPicker = createCatPicker(document.getElementById('observation-cat-picker'), ipcRenderer);
    let catProfiles = [];
    const areasData = loadAreasData()

    // 初始视野：华工大学城校区（中心取自主环），数据异常时退回固定坐标
    function scutUctownCenter() {
        const scut = (areasData.universities || []).find(u => u.name === '华南理工大学')
        const campus = scut && (scut.campuses || []).find(c => c.name === '大学城校区')
        const mainRing = campus && mainRingOf(campus)
        if (mainRing && mainRing.length > 0) {
            const lat = mainRing.reduce((s, p) => s + p[0], 0) / mainRing.length
            const lng = mainRing.reduce((s, p) => s + p[1], 0) / mainRing.length
            return [lat, lng]
        }
        return [23.0549, 113.3973]
    }

    // 初始化地图 (默认定位到华工大学城校区)
    const map = L.map('map').setView(scutUctownCenter(), 15);

    // 使用 高德地图 瓦片图层（离线时通过 tileerror 给出提示，记录数据不受影响）
    let offlineNoticeShown = false
    L.tileLayer('https://webrd02.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
        attribution: '&copy; 高德地图'
    }).on('tileerror', () => {
        if (offlineNoticeShown) return
        offlineNoticeShown = true
        document.getElementById('offline-notice').style.display = 'flex'
    }).addTo(map);

    // ==========================================
    // （渲染与判定所用数据已在上方加载）
    // ==========================================

    // 判定坐标所在高校区域；校外时附带最近的校园参考
    function areaOfCoords(lat, lng) {
        const match = detectArea(areasData, lat, lng)
        if (match) return { match, text: formatArea(match) }
        const near = nearestAreaLabel(areasData, lat, lng)
        return { match: null, text: near ? `校外 · ${near}` : '校外' }
    }

    // 记录的展示用区域文本：优先用保存的 area，旧记录按坐标现算
    function areaTextOf(record) {
        if (record.area) return record.area
        if (Number.isFinite(record.lat) && Number.isFinite(record.lng)) {
            const match = detectArea(areasData, record.lat, record.lng)
            if (match) return formatArea(match)
        }
        return ''
    }

    let campusLayer = L.layerGroup()
    let areasOn = true

    function renderCampusLayer() {
        campusLayer.clearLayers()
        if (!areasOn) return
        const campusStyle = { color: '#7ea1b3', weight: 2, dashArray: '6 5', fillColor: '#7ea1b3', fillOpacity: 0.05 }
        const zoneStyle = { color: '#d8a04e', weight: 1, dashArray: '3 5', fillColor: '#d8a04e', fillOpacity: 0.04 }
        for (const uni of areasData.universities || []) {
            for (const campus of uni.campuses || []) {
                // polygons_gcj02 是外环数组：L.polygon 直接支持多环（主校区+飞地）
                if (Array.isArray(campus.polygons_gcj02) && campus.polygons_gcj02.length > 0) {
                    const poly = L.polygon(campus.polygons_gcj02, campusStyle)
                    poly.bindTooltip(`<img class="ui-icon" src="../assets/学校-L.svg" alt="" aria-hidden="true"> ${escapeHtml(uni.name)}·${escapeHtml(campus.name)}`, { permanent: true, direction: 'center', className: 'campus-label' })
                    // 点击校园色块查看该区域汇总（新增打点模式下不弹）
                    poly.bindPopup(() => buildCampusSummaryPopup(`${escapeHtml(uni.name)}·${escapeHtml(campus.name)}`))
                    campusLayer.addLayer(poly)
                }
                for (const zone of campus.zones || []) {
                    if (!Array.isArray(zone.polygons_gcj02) || zone.polygons_gcj02.length === 0) continue
                    const zp = L.polygon(zone.polygons_gcj02, zoneStyle)
                    zp.bindTooltip(zone.name, { sticky: true })
                    campusLayer.addLayer(zp)
                }
            }
        }
    }

    function toggleCampusAreas() {
        areasOn = !areasOn;
        const btn = document.getElementById('areas-btn');
        btn.classList.toggle('active', areasOn);
        if (areasOn) {
            renderCampusLayer()
            campusLayer.addTo(map)
        } else {
            map.removeLayer(campusLayer)
        }
    }

    // 校园区域汇总弹窗：打卡数、猫点数、最近发现，可一键跳到筛选好的列表
    function buildCampusSummaryPopup(areaValue) {
        const records = allRecords.filter(r => {
            const area = areaTextOf(r);
            return area === areaValue || area.startsWith(areaValue + '·');
        });

        const el = document.createElement('div');
        el.className = 'campus-summary';

        let latest = null;
        for (const r of records) {
            if (!latest || parseRecordTime(r) > parseRecordTime(latest)) latest = r;
        }
        const clusterCount = clusterRecords(records, 50, r => ({ lat: r.lat, lng: r.lng }))
            .filter(c => c.center).length;

        el.innerHTML = `
            <div class="campus-summary-title"><img class="ui-icon" src="../assets/学校-L.svg" alt="" aria-hidden="true"> ${escapeHtml(areaValue)}</div>
            <div>共 ${records.length} 条打卡记录 · ${clusterCount} 处猫点</div>
            ${latest ? `<div>最近发现：${escapeHtml(latest.title || '未命名')}（${new Date(parseRecordTime(latest)).toLocaleDateString()}）</div>` : '<div>暂无记录，快去发现第一只猫吧</div>'}
            <button>查看这个区域的记录</button>
        `;
        el.querySelector('button').addEventListener('click', () => {
            currentCluster = null;
            document.getElementById('area-filter').value = areaValue;
            map.closePopup();
            showRecordsList();
        });
        return el;
    }

    let isAdding = false;
    let currentLatLng = null;
    let allRecords = [];
    let markers = [];
    let currentUser = null;
    let cloudEnabled = false;
    let socialEnabled = false;
    let selectedImagePaths = [];
    let currentCluster = null; // 猫点聚合的下钻状态

    function recordPhotos(record) {
        const photos = Array.isArray(record.images) ? record.images.filter(url => safeResourceUrl(url)) : [];
        return photos.length ? photos : safeResourceUrl(record.image) ? [record.image] : [];
    }

    function linkedRecordCat(record) {
        if (cloudEnabled && !record.is_mine) return null;
        return catProfiles.find(cat => String(cat.id) === String(record.cat_id));
    }

    function setRecordAvatar(image, record) {
        const key = record.cat_id || record.id || '';
        image.onerror = () => {
            image.onerror = null;
            image.src = defaultCatAvatar(key);
        };
        image.src = catAvatarUrl(linkedRecordCat(record)?.avatar || record.cat_avatar, key);
    }

    function makeMarkerIcon(record) {
        const image = document.createElement('img');
        image.alt = '';
        setRecordAvatar(image, record);
        return L.divIcon({
            className: 'cat-marker',
            html: image,
            iconSize: [38, 38],
            iconAnchor: [19, 19],
            popupAnchor: [0, -18]
        });
    }

    async function init() {
        try {

    // 加载已有记录
    async function loadMapRecords() {
        try {
            const records = await ipcRenderer.invoke('get_map_records');
            catProfiles = await ipcRenderer.invoke('get_cats') || [];
            if (Array.isArray(records)) {
                allRecords = records;
                renderMarkers(allRecords);
                
                // Refresh list if visible
                if (document.getElementById('records-list-container') && 
                    document.getElementById('records-list-container').style.display === 'flex') {
                    filterList();
                }
            }
        } catch (e) {
            console.error("Failed to load records:", e);
        }

    function renderMarkers(recordsToRender) {
        markers.forEach(marker => map.removeLayer(marker));
        markers = [];

        // 热力图模式下隐藏猫咪标记，避免重叠
        if (!heatOn) {
            recordsToRender.forEach(record => {
                const [mainImg] = recordPhotos(record);
                const icon = makeMarkerIcon(record);

                const areaText = areaTextOf(record);

                // 用 DOM 元素构建弹窗并绑定事件：避免字符串拼接 innerHTML 被 XSS 注入
                const popupEl = document.createElement('div');
                popupEl.className = 'custom-popup';
                popupEl.innerHTML = `
                    ${mainImg ? `<img src="${safeResourceUrl(mainImg)}" class="popup-img">` : ''}
                    <div class="popup-info">
                        <div class="popup-title">${escapeHtml(record.title)}</div>
                        <div class="popup-desc">${escapeHtml(record.desc || '无描述')}</div>
                        ${areaText ? `<div class="popup-area"><img class="ui-icon" src="../assets/学校-L.svg" alt="" aria-hidden="true"> ${escapeHtml(areaText)}</div>` : ''}
                        <div class="user-tag" style="font-size:12px;color:#666;margin-top:5px;display:flex;align-items:center;">
                            ${record.profiles?.avatar_url ? `<img src="${safeResourceUrl(record.profiles.avatar_url)}" style="width:20px;height:20px;border-radius:50%;margin-right:5px;">` : ''}
                             <span>${escapeHtml(record.profiles?.username || '本地记录')}</span>
                        </div>
                        <div style="text-align:center;margin-top:5px;color:#367f83;font-size:12px;">点击查看详情</div>
                    </div>
                `;
                popupEl.addEventListener('click', () => showDetailModalById(record.id));
                const marker = L.marker([record.lat, record.lng], { icon, title: record.title || '猫咪观察' }).addTo(map).bindPopup(popupEl);
                marker.getElement()?.setAttribute('aria-label', record.title || '猫咪观察');
                marker.recordId = record.id;
                markers.push(marker);
            });
        }
        renderHeat(recordsToRender);
    }

    // 热力图
    let heatOn = false;
    let heatLayer = null;
    function toggleHeatmap() {
        heatOn = !heatOn;
        const btn = document.getElementById('heat-btn');
        btn.classList.toggle('active', heatOn);
        btn.innerHTML = heatOn ? '<img class="ui-icon " src="../assets/猫爪.svg" alt="" aria-hidden="true"> 标记' : '热力图';
        if (heatLayer) {
            map.removeLayer(heatLayer);
            heatLayer = null;
        }
        renderMarkers(allRecords);
    }
    function renderHeat(recordsToRender) {
        if (heatLayer) {
            map.removeLayer(heatLayer);
            heatLayer = null;
        }
        if (!heatOn) return;
        const points = recordsToRender
            .filter(r => Number.isFinite(r.lat) && Number.isFinite(r.lng))
            .map(r => [r.lat, r.lng, 1]);
        if (points.length === 0) return;
        heatLayer = L.heatLayer(points, {
            radius: 32,
            blur: 20,
            maxZoom: 15,
            gradient: { 0.2: '#d9ecef', 0.4: '#a2cec9', 0.7: '#65aaa7', 1.0: '#367f83' }
        }).addTo(map);
    }

    function observationRow(record, metadata, onOpen, clustered = false) {
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'observation-row';
        const demo = [true, 1, 'true', '1'].includes(record.is_demo);
        const rawTitle = String(record.title || '');
        const title = (demo ? rawTitle.replace(/^【示例】\s*/, '') : rawTitle) || '猫咪观察';
        row.innerHTML = `
            <span class="observation-row-image"><img alt=""></span>
            <span class="observation-row-body">
                <span class="observation-row-title">${escapeHtml(title)}${demo ? '<span class="observation-demo">示例</span>' : ''}</span>
                ${record.desc ? `<span class="observation-row-description">${escapeHtml(record.desc)}</span>` : ''}
                <span class="observation-row-meta">${metadata.filter(Boolean).map(value => `<span>${escapeHtml(value)}</span>`).join('')}</span>
            </span>
            <span class="observation-row-chevron" aria-hidden="true"></span>`;
        const image = row.querySelector('img');
        image.loading = 'lazy';
        const [photo] = clustered ? [] : recordPhotos(record);
        if (photo) {
            image.onerror = () => setRecordAvatar(image, record);
            image.src = photo;
        } else setRecordAvatar(image, record);
        row.addEventListener('click', onOpen);
        return row;
    }

    function replaceObservationRows(rows) {
        if (rows.length) {
            listContent.replaceChildren(...rows);
            return;
        }
        const empty = document.createElement('p');
        empty.className = 'observations-empty';
        empty.textContent = '没有符合条件的观察。试试其他关键词或重置筛选。';
        listContent.replaceChildren(empty);
    }

    function renderList(records, distanceCenter = null) {
        replaceObservationRows(records.map(record => {
            const time = parseRecordTime(record);
            return observationRow(record, [
                areaTextOf(record),
                time ? new Date(time).toLocaleDateString() : '',
                record.profiles?.username || '本地记录',
                distanceCenter ? fmtDistance(recordDistance(record, distanceCenter)) : ''
            ], () => showDetailModal(record));
        }));
    }

    function renderDetailPhotos(images) {
        const media = document.getElementById('detail-media');
        const gallery = document.getElementById('detail-gallery');
        const photo = document.getElementById('detail-img');
        gallery.replaceChildren();
        media.hidden = !images.length;
        gallery.hidden = images.length < 2;
        if (!images.length) { photo.removeAttribute('src'); return; }

        function selectPhoto(index) {
            photo.src = images[index];
            photo.alt = `观察照片 ${index + 1}`;
            photo.parentElement.onclick = () => openLightbox(images[index]);
            for (const [i, button] of Array.from(gallery.children).entries()) {
                button.setAttribute('aria-pressed', String(i === index));
            }
        }

        if (images.length > 1) images.forEach((url, index) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'gallery-thumb';
            button.setAttribute('aria-label', `查看第 ${index + 1} 张观察照片`);
            const image = document.createElement('img');
            image.src = url;
            image.alt = '';
            button.append(image);
            button.onclick = () => selectPhoto(index);
            gallery.append(button);
        });
        selectPhoto(0);
    }

    function showDetailModal(record) {
        if (!currentDetailRecord) detailOpener = document.activeElement;
        currentDetailRecord = record;
        const cat = linkedRecordCat(record);
        document.getElementById('detail-title').textContent = record.title || '猫咪观察';
        document.getElementById('detail-desc').textContent = record.desc || '';
        document.getElementById('detail-desc').hidden = !record.desc;
        document.getElementById('detail-user').textContent = record.profiles?.username || '本地记录';
        setRecordAvatar(document.getElementById('detail-avatar'), record);
        renderDetailPhotos(recordPhotos(record));

        const time = parseRecordTime(record);
        const meta = document.getElementById('detail-meta');
        meta.replaceChildren();
        for (const [label, value] of [
            ['猫咪', cat?.name || record.cat_name],
            ['地点', areaTextOf(record) || record.location],
            ['时间', time > 0 ? new Date(time).toLocaleString() : '']
        ]) {
            if (!value) continue;
            const group = document.createElement('div');
            const term = document.createElement('dt');
            const description = document.createElement('dd');
            term.textContent = label;
            description.textContent = value;
            group.append(term, description);
            meta.append(group);
        }

        const list = document.getElementById('comments-list');
        list.innerHTML = '<p class="comment-status">正在读取评论…</p>';
        const like = document.getElementById('like-btn');
        like.disabled = true;
        like.classList.remove('liked');
        like.setAttribute('aria-pressed', 'false');
        like.innerHTML = '<img class="ui-icon" src="../assets/爱心_描边.svg" alt=""> 点赞';
        document.getElementById('like-count').textContent = '…';
        document.getElementById('comment-input').value = '';

        document.getElementById('btn-edit').hidden = !record.is_mine;
        document.getElementById('btn-delete').hidden = !record.is_mine;
        detailModal.style.display = 'grid';
        detailModal.querySelector('.detail-info').scrollTop = 0;
        document.getElementById('detail-close').focus();

    async function loadInteractions(recordId) {
        const likeBtn = document.getElementById('like-btn');
        const commentsList = document.getElementById('comments-list');
        try {
            const { likes, comments, is_liked } = await ipcRenderer.invoke('get_record_interactions', recordId);
            if (currentDetailRecord?.id !== recordId) return;
            document.getElementById('like-count').textContent = likes;
            likeBtn.classList.toggle('liked', Boolean(is_liked));
            likeBtn.setAttribute('aria-pressed', String(Boolean(is_liked)));
            likeBtn.innerHTML = is_liked
                ? '<img class="ui-icon" src="../assets/爱心,实心.svg" alt=""> 已赞'
                : '<img class="ui-icon" src="../assets/爱心_描边.svg" alt=""> 点赞';
            likeBtn.onclick = () => toggleLike(recordId);
            likeBtn.disabled = false;
            commentsList.replaceChildren();
            if (!comments.length) commentsList.innerHTML = '<p class="comment-status">还没有评论。</p>';
            for (const comment of comments) {
                const item = document.createElement('div');
                item.className = 'comment-item';
                const author = document.createElement('span');
                author.className = 'comment-user';
                author.textContent = comment.profiles?.username || '未知用户';
                const time = document.createElement('time');
                time.className = 'comment-time';
                time.textContent = new Date(comment.created_at).toLocaleString();
                const content = document.createElement('p');
                content.className = 'comment-content';
                content.textContent = comment.content;
                item.append(author, time, content);
                if (currentUser && comment.user_id === currentUser.id) {
                    const remove = document.createElement('button');
                    remove.type = 'button';
                    remove.className = 'delete-comment-btn';
                    remove.textContent = '删除评论';
                    remove.onclick = () => deleteComment(comment.id);
                    item.append(remove);
                }
                commentsList.append(item);
            }
        } catch {
            if (currentDetailRecord?.id !== recordId) return;
            document.getElementById('like-count').textContent = '—';
            commentsList.innerHTML = '<p class="comment-status">评论暂时无法加载。</p>';
        }
    }

        if (event.key === 'Escape') {
            event.preventDefault();
            if (document.getElementById('lightbox').style.display === 'flex') closeLightbox();
            else closeDetailModal();
        } else if (event.key === 'Tab') {
            const controls = Array.from(detailModal.querySelectorAll('button:not(:disabled), input'))
                .filter(control => control.getClientRects().length);
            const first = controls[0];
            const last = controls.at(-1);
            if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
            else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
        }
    });

    async function saveRecord() {
        showObservationError('');
        try { catPicker.validate(); } catch (error) { showObservationError(error.message); return; }
        const title = document.getElementById('record-title').value.trim();
        const desc = document.getElementById('record-desc').value;

        if (!title) {
            showObservationError('请输入标题', 'record-title');
            return;
        }
        if (!currentLatLng) {
            showObservationError('请先在地图上选择位置');
            return;
        }

        // 落在高校范围内时保存判定结果，校外留空
        const { match } = areaOfCoords(currentLatLng.lat, currentLatLng.lng);

        const record = {
            lat: currentLatLng.lat,
            lng: currentLatLng.lng,
            title: title,
            desc: desc,
            images: selectedImagePaths,
            cat_id: catPicker.value,
            area: match ? formatArea(match) : ''
        };

        const saveButton = document.getElementById('save-observation');
        if (saveButton.disabled) return;
        saveButton.disabled = true;
        saveButton.textContent = '正在保存…';
        try {
            let saved;
            if (editingRecordId) {
                saved = await ipcRenderer.invoke('update_map_record', {
                    id: editingRecordId, 
                    record: record 
                });
            } else {
                record.id = Date.now();
                saved = await ipcRenderer.invoke('add_map_record', record);
            }
            if (!saved) throw new Error('记录未保存，请重试');
            await loadMapRecords(); // 保存成功后刷新地图
            closeModal();
        } catch (err) {
            console.error(err);
            showObservationError('保存失败：' + err.message);
        } finally {
            saveButton.disabled = false;
            saveButton.textContent = '保存观察';
        }
    }

    function filterList() {
        const value = id => document.getElementById(id).value;
        const checked = id => document.getElementById(id).checked;
        const keywords = value('list-search-input').trim().toLowerCase().split(/\s+/).filter(Boolean);
        const mineOnly = checked('filter-mine-only');
        const byDistance = checked('distance-sort');
        const clusterMode = checked('cluster-mode');
        const area = value('area-filter');
        const radius = Number(value('distance-filter'));
        const dateStart = value('date-start');
        const dateEnd = value('date-end');
        const start = dateStart ? new Date(dateStart + 'T00:00:00').getTime() : -Infinity;
        const end = dateEnd ? new Date(dateEnd + 'T23:59:59.999').getTime() : Infinity;

        const active = [mineOnly, byDistance, clusterMode, area, radius, dateStart || dateEnd].filter(Boolean).length;
        const filterCount = document.getElementById('list-filter-count');
        filterCount.hidden = !active;
        filterCount.textContent = active ? String(active) : '';
        document.getElementById('list-reset').disabled = !active && !keywords.length;
        document.getElementById('list-cluster-back').hidden = !currentCluster;

        const filtered = (currentCluster ? currentCluster.members : allRecords).filter(record => {
            const time = parseRecordTime(record);
            if ((mineOnly && !record.is_mine) ||
                ((dateStart || dateEnd) && !(time > 0 && time >= start && time <= end)) ||
                !matchAreaFilter(record, area) || !matchDistanceFilter(record, radius)) return false;
            if (!keywords.length) return true;
            const text = [record.title, record.desc, record.area, areaTextOf(record), record.cat_name, linkedRecordCat(record)?.name]
                .filter(Boolean).join(' ').toLowerCase();
            return keywords.every(keyword => text.includes(keyword));
        });
        filtered.sort((a, b) => parseRecordTime(b) - parseRecordTime(a));
        const center = byDistance ? map.getCenter() : null;

        const count = document.getElementById('list-results-count');
        if (clusterMode && !currentCluster) {
            const clusters = clusterRecords(filtered, 50, record => ({ lat: record.lat, lng: record.lng }));
            if (center) clusters.sort((a, b) => recordDistance(a.seed, center) - recordDistance(b.seed, center));
            count.textContent = `${clusters.length} 处位置 · ${filtered.length} 条观察`;
            renderClusters(clusters, center);
        } else {
            if (center) filtered.sort((a, b) => recordDistance(a, center) - recordDistance(b, center));
            count.textContent = `${filtered.length} 条观察`;
            renderList(filtered, center);
        }
    }

    function onFilterChanged() {

    function clearObservationFilters() {
        for (const id of ['list-search-input', 'area-filter', 'date-start', 'date-end']) document.getElementById(id).value = '';
        for (const id of ['filter-mine-only', 'distance-sort', 'cluster-mode']) document.getElementById(id).checked = false;
        document.getElementById('distance-filter').value = '0';
        onFilterChanged();
    }

    // 校园筛选：选项为“高校·校区”或高校名（前缀匹配），'__outside__' 代表校外
    function matchAreaFilter(record, value) {
        if (!value) return true;
        const area = areaTextOf(record);
        if (value === '__outside__') return !area;
        return !!area && (area === value || area.startsWith(value + '·'));
    }

    // 记录与地图视野中心的距离（米）；无法定位返回 Infinity 永远排在最后
    function recordDistance(record, center) {
        if (!Number.isFinite(record.lat) || !Number.isFinite(record.lng)) return Infinity;
        return haversineMeters(record.lat, record.lng, center.lat, center.lng);
    }

    function matchDistanceFilter(record, maxDist) {
        if (!maxDist) return true;
        return recordDistance(record, map.getCenter()) <= maxDist;
    }

    function fmtDistance(meters) {
        if (!Number.isFinite(meters)) return '';
        return meters >= 1000 ? `${(meters / 1000).toFixed(1)}km` : `${Math.round(meters)}m`;
    }

    // 填充校园筛选下拉：华工各校区单独列出，其他高校按校名聚合
    function populateAreaFilter() {
        const select = document.getElementById('area-filter');
        select.innerHTML = '<option value="">全部区域</option><option value="__outside__">校外</option>';
        for (const opt of campusOptions(areasData)) {
            const option = document.createElement('option');
            option.value = opt.value;
            option.textContent = opt.label;
            select.appendChild(option);
        }
    }

    function renderClusters(clusters, distanceCenter) {
        replaceObservationRows(clusters.map(cluster => observationRow(cluster.seed, [
            `${cluster.members.length} 条观察`,
            areaTextOf(cluster.seed),
            distanceCenter ? fmtDistance(recordDistance(cluster.seed, distanceCenter)) : ''
        ], () => {
            currentCluster = cluster;
            filterList();
            document.getElementById('list-cluster-back').focus();
        }, true)));
    }

    function leaveObservationCluster() {
        currentCluster = null;
        filterList();
        listContent.querySelector('button')?.focus();
    }

    // Locate Record from Detail
    function locateRecord() {
        if (!currentDetailRecord) return;
        const targetRecord = currentDetailRecord;
        closeDetailModal();
        hideRecordsList();
        map.setView([targetRecord.lat, targetRecord.lng], 15);
        markers.forEach(marker => {
            if (marker.recordId === targetRecord.id) {
                marker.openPopup();
            }
        });
    }
    
    // Edit/Delete stubs
    async function deleteMapRecord() {
        if (!currentDetailRecord) return;
        if (!confirm('确定要删除这条记录吗？')) return;
        try {
            await ipcRenderer.invoke('delete_map_record', { id: currentDetailRecord.id });
            closeDetailModal();
            loadMapRecords();
        } catch (e) { alert('删除失败: ' + e.message); }
    }
    
    function editMapRecord() {
        if (!currentDetailRecord) return;

        document.getElementById('record-modal-title').textContent = '编辑观察';
        editingRecordId = currentDetailRecord.id;
        currentLatLng = { lat: currentDetailRecord.lat, lng: currentDetailRecord.lng };

        catPicker.setValue(currentDetailRecord.cat_id);
        document.getElementById('record-title').value = currentDetailRecord.title;
        document.getElementById('record-desc').value = currentDetailRecord.desc || '';

        selectedImagePaths = currentDetailRecord.images || (currentDetailRecord.image ? [currentDetailRecord.image] : []);
        updateImagePreview();
        updateAreaPreview();

        closeDetailModal();
        showObservationError('');
        document.getElementById('modal').style.display = 'flex';
        focusObservationField();
    }

    renderCampusLayer();
    campusLayer.addTo(map);
    populateAreaFilter();

    const initialRecords = init();
    let locatedHighlight = null;
    async function focusRecordOnMap(target) {
        if (!Number.isFinite(target?.lat) || !Number.isFinite(target?.lng) || Math.abs(target.lat)>90 || Math.abs(target.lng)>180) return;
        await initialRecords;
        if (heatOn) toggleHeatmap();
        if (!markers.some(item => String(item.recordId) === String(target.id))) await loadMapRecords();
        hideRecordsList();
        map.setView([target.lat, target.lng], 18);
        const marker = markers.find(item => String(item.recordId) === String(target.id));
        if (locatedHighlight) map.removeLayer(locatedHighlight);
        locatedHighlight = L.circleMarker([target.lat, target.lng], { radius: 22, color: '#367f83', weight: 2, fillOpacity: 0.08 }).addTo(map);
        if (marker) marker.openPopup();
    }
    window.addEventListener('message', event => {
        if (event.source === window.parent && event.data?.type === 'focus-map-record') focusRecordOnMap(event.data.record);
    });
    ipcRenderer.on('locate-map-record', (_event, target) => focusRecordOnMap(target));
    window.parent.postMessage({ type: 'map-ready' }, '*');
</script>
</body>
</html>
