<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喵喵地图</title>
    <link rel="icon" href="../assets/favicon.ico">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/icons.css">
    <link rel="stylesheet" href="../css/light.css">
</head>
<body>
    <div class="app-shell">
        <aside class="app-sidebar" aria-label="主导航">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true"><img class="ui-icon cat-brand-icon" src="../assets/猫咪.svg" alt="" aria-hidden="true"></div>
                <div class="brand-copy">
                    <div class="brand-name">喵喵地图</div>
                    <div class="brand-subtitle">记录每一次偶遇</div>
                </div>
            </div>

            <div class="nav-section-label">探索与记录</div>
            <nav class="app-nav">
                <button class="nav-item active" aria-current="page" data-route="map" type="button">
                    <span class="nav-icon" style="--nav-icon:url('../assets/地图.svg')" aria-hidden="true"><img class="ui-icon" src="../assets/地图.svg" alt="" aria-hidden="true"></span><span class="nav-label">发现地图</span>
                </button>
                <button class="nav-item" data-route="public-records" type="button">
                    <span class="nav-icon" style="--nav-icon:url('../assets/地球.svg')" aria-hidden="true"><img class="ui-icon" src="../assets/地球.svg" alt=""></span><span class="nav-label">公开观察</span>
                </button>
                <button class="nav-item" data-route="records" type="button">
                    <span class="nav-icon" style="--nav-icon:url('../assets/订单.svg')" aria-hidden="true"><img class="ui-icon" src="../assets/订单.svg" alt="" aria-hidden="true"></span><span class="nav-label">我的观察记录</span>
                </button>
                <button class="nav-item" data-route="cats" type="button">
                    <span class="nav-icon" style="--nav-icon:url('../assets/icons/cat-profile.svg')" aria-hidden="true"><img class="ui-icon" src="../assets/icons/cat-profile.svg" alt=""></span><span class="nav-label">猫咪档案</span>
                </button>
                <button class="nav-item" data-route="stats" type="button">
                    <span class="nav-icon" style="--nav-icon:url('../assets/面-统计面板.svg')" aria-hidden="true"><img class="ui-icon" src="../assets/面-统计面板.svg" alt="" aria-hidden="true"></span><span class="nav-label">统计面板</span>
                </button>
                <button class="nav-item" data-route="assistant" type="button">
                    <span class="nav-icon" style="--nav-icon:url('../assets/icons/compass-mono.svg')" aria-hidden="true"><img class="ui-icon" src="../assets/指南针.svg" alt=""></span><span class="nav-label">寻猫小助手</span>
                </button>
            </nav>

            <div class="sidebar-spacer"></div>

            <div class="data-manage">
                <div class="nav-section-label">数据管理</div>
                <div class="data-actions">
                    <button class="data-btn" id="export-data-btn" type="button">导出备份</button>
                    <button class="data-btn" id="import-data-btn" type="button">导入备份</button>
                </div>
            </div>

            <div class="account-card">
                <button class="account-avatar" id="account-avatar" type="button" aria-label="打开个人档案" title="个人档案"><img class="ui-icon cat-brand-icon" src="../assets/猫咪2.svg" alt="" aria-hidden="true"></button>
                <div class="account-copy">
                    <div class="account-name" id="account-name">本地模式</div>
                    <div class="account-status" id="account-status">记录保存在本机</div>
                    <button class="account-profile" id="edit-profile" type="button">个人档案</button>
                </div>
                <button class="account-action" id="account-action" type="button">登录</button>
            </div>
        </aside>

        <main class="app-main">
            <header class="app-topbar">
                <div class="page-heading">
                    <h1 class="page-title" id="page-title">发现地图</h1>
                    <p class="page-description" id="page-description">看看附近有哪些猫咪，也记录你的新发现</p>
                </div>
                <button class="primary-action" id="primary-action" type="button">＋ 新增观察</button>
            </header>
            <section class="workspace" aria-label="应用内容">
                <iframe id="workspace-frame" title="应用内容" src="map.html"></iframe>
            </section>
        </main>
    </div>

    <script>
        const { ipcRenderer } = require('electron')
        const { safeResourceUrl } = require('../../backend/utils')

        const routes = {
            profile: { title: '个人档案', description: '让每一次相遇，都有你的名字', src: 'profile.html', action: null },
            map: {
                title: '发现地图',
                description: '看看附近有哪些猫咪，也记录你的新发现',
                src: 'map.html',
                action: 'add-map'
            },
            records: {
                title: '我的观察记录',
                description: '整理你遇见过的猫咪与地点',
                src: 'records.html',
                action: 'add-record'
            },
            'public-records': {
                title: '公开观察',
                description: '浏览所有猫友发布的观察记录和地图打卡',
                src: 'records.html?scope=public',
                action: 'add-record'
            },
            assistant: {
                title: '寻猫小助手',
                description: '从公开观察里找猫咪、地点和目击时间',
                src: 'assistant.html',
                action: null
            },
            cats: {
                title: '猫咪档案',
                description: '给常驻猫咪建立档案，串起每一次相遇',
                src: 'cats.html',
                action: null
            },
            stats: {
                title: '统计面板',
                description: '你和猫咪们的故事，都用数据说话',
                src: 'stats.html',
                action: null
            }
        }

        const frame = document.getElementById('workspace-frame')
        const title = document.getElementById('page-title')
        const description = document.getElementById('page-description')
        const primaryAction = document.getElementById('primary-action')

        let activeRoute = 'map'
        let accountActionMode = 'login'

        function navigate(route) {
            const config = routes[route] || routes.map
            activeRoute = route
            title.textContent = config.title
            description.textContent = config.description
            frame.src = config.src
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.toggle('active', item.dataset.route === route)
                if (item.dataset.route === route) item.setAttribute('aria-current', 'page')
                else item.removeAttribute('aria-current')
            })
            primaryAction.style.display = config.action ? 'inline-flex' : 'none'
            if (config.action === 'add-map') primaryAction.innerHTML = '＋ 新增观察'
            if (config.action === 'add-record') primaryAction.innerHTML = '＋ 添加记录'
        }

        document.getElementById('edit-profile').addEventListener('click', () => navigate('profile'))
        document.getElementById('account-avatar').addEventListener('click', () => navigate('profile'))
        window.appNavigate = navigate
        let pendingMapTarget = null
        window.addEventListener('message', event => {
            if (event.source !== frame.contentWindow) return
            if (event.data?.type === 'locate-record') {
                const target = event.data.record
                if (!Number.isFinite(target?.lat) || !Number.isFinite(target?.lng) || Math.abs(target.lat)>90 || Math.abs(target.lng)>180) return
                pendingMapTarget = target
                navigate('map')
            }
            if (event.data?.type === 'map-ready' && pendingMapTarget) {
                frame.contentWindow.postMessage({ type: 'focus-map-record', record: pendingMapTarget }, '*')
                pendingMapTarget = null
            }
            if (event.data && event.data.type === 'navigate') navigate(event.data.route)
            if (event.data?.type === 'profile-updated') refreshAccount()
        })

        document.querySelectorAll('.nav-item').forEach(item => {
            item.title = item.textContent.trim()
            item.setAttribute('aria-label', item.textContent.trim())
            item.addEventListener('click', () => navigate(item.dataset.route))
        })

        primaryAction.addEventListener('click', async () => {
            if (routes[activeRoute]?.action === 'add-record') await ipcRenderer.invoke('open_add_record_window')
            else if (activeRoute === 'map') {
                frame.focus()
                frame.contentWindow?.postMessage({ type: 'start-map-add' }, '*')
            }
        })

        // 数据导出 / 导入
        document.getElementById('export-data-btn').addEventListener('click', async () => {
            const result = await ipcRenderer.invoke('export_data')
            alert(result?.message || '导出完成')
        })
        document.getElementById('import-data-btn').addEventListener('click', async () => {
            const result = await ipcRenderer.invoke('import_data')
            alert(result?.message || '导入完成')
            if (result?.ok) frame.contentWindow?.location.reload() // 导入成功后刷新当前页面数据
        })

        document.getElementById('account-action').addEventListener('click', async () => {
            if (accountActionMode === 'logout') {
                await ipcRenderer.invoke('auth-logout')
                refreshAccount()
            } else {
                await ipcRenderer.invoke('open_login_window')
            }
        })

        let previousUserId
        function renderAccountAvatar(avatar) {
            const button = document.getElementById('account-avatar')
            const image = document.createElement('img')
            image.alt = ''
            const fallback = () => {
                image.onerror = null
                image.className = 'ui-icon cat-brand-icon'
                image.src = '../assets/猫咪2.svg'
            }
            if (safeResourceUrl(avatar)) {
                image.onerror = fallback
                image.src = avatar
            } else fallback()
            button.replaceChildren(image)
        }
        async function refreshAccount() {
            const cloudEnabled = await ipcRenderer.invoke('is-cloud-enabled')
            const action = document.getElementById('account-action')
            if (!cloudEnabled) {
                const local = await ipcRenderer.invoke('get_current_user_profile')
                document.getElementById('account-name').textContent = local?.profile?.username || '猫咪观察员'
                document.getElementById('account-status').textContent = '记录保存在此电脑，无需登录'
                renderAccountAvatar(local?.profile?.avatar_url)
                action.style.display = 'none'
                return
            }

            const current = await ipcRenderer.invoke('get-current-user')
            const userId = current?.id || null
            if (previousUserId !== undefined && userId !== previousUserId) frame.contentWindow?.location.reload()
            previousUserId = userId
            if (current) {
                let displayName = current.email || '已登录用户'
                let avatar = null
                try {
                    const profileResult = await ipcRenderer.invoke('get_current_user_profile')
                    const profile = profileResult && profileResult.profile
                    if (profile?.username) displayName = profile.username
                    avatar = profile?.avatar_url || null
                } catch (error) { console.warn('读取用户资料失败', error) }
                document.getElementById('account-name').textContent = displayName
                document.getElementById('account-status').textContent = '云端同步已开启'
                action.textContent = '退出'
                action.style.display = 'inline'
                accountActionMode = 'logout'
                renderAccountAvatar(avatar)
            } else {
                document.getElementById('account-name').textContent = '未登录'
                const online = await ipcRenderer.invoke('get-cloud-status').catch(() => true)
                document.getElementById('account-status').textContent = online ? '云端地图 · 登录后可发布' : '云端连接失败，请检查网络'
                renderAccountAvatar(null)
                action.textContent = '登录'
                action.style.display = 'inline'
                accountActionMode = 'login'
            }
        }

        refreshAccount()
        window.addEventListener('focus', refreshAccount)
    </script>
</body>
</html>
